[workspace]
resolver = "2"
members = ["crates/annot-core", "crates/annot-cli"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
gix = "0.86"
imara-diff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "3"
fs4 = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
assert_cmd = "2"
